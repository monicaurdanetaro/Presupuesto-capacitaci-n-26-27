<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presupuesto de Capacitación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#12294f;
    --navy-2:#0c1d3d;
    --blue:#2f6bf0;
    --blue-2:#5b8dff;
    --blue-light:#eaf1ff;
    --bg-1:#e9f1fc;
    --bg-2:#f7fbff;
    --green:#1a9d63;
    --green-bg:#e7f7ee;
    --red:#e0483f;
    --red-bg:#fdecea;
    --amber:#d98c1a;
    --amber-bg:#fdf3e3;
    --gray:#7c8aa0;
    --gray-light:#eef2f8;
    --card-radius:20px;
    --pill:999px;
    --border:#e3e9f3;
    --shadow: 0 8px 24px rgba(18,41,79,0.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:linear-gradient(160deg,var(--bg-1),var(--bg-2) 60%);color:var(--navy);min-height:100vh;}
  h1,h2,h3,.display{font-family:'Poppins',sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:'Inter',sans-serif;}

  .app{display:flex;min-height:100vh;}

  /* SIDEBAR */
  .sidebar{
    width:250px;flex-shrink:0;background:#ffffff;border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;padding:6px 8px 4px 8px;}
  .brand-logo{height:26px;width:auto;object-fit:contain;}
  .brand-sub{font-family:'Poppins',sans-serif;font-weight:600;font-size:12.5px;color:var(--gray);padding:0 8px 20px 8px;letter-spacing:.01em;}

  .search{display:flex;align-items:center;gap:8px;background:var(--gray-light);border-radius:12px;padding:9px 12px;margin-bottom:18px;color:var(--gray);font-size:13px;}
  .search svg{flex-shrink:0;}

  .nav-group{margin-bottom:16px;}
  .nav-label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--gray);text-transform:uppercase;padding:0 10px;margin-bottom:8px;}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:#3a4a63;
    font-size:14px;font-weight:500;margin-bottom:2px;transition:.15s;border:none;background:none;width:100%;text-align:left;
  }
  .nav-item svg{flex-shrink:0;opacity:.75;}
  .nav-item:hover{background:var(--gray-light);}
  .nav-item.active{background:var(--blue-light);color:var(--blue);font-weight:600;}
  .nav-item.active svg{opacity:1;}
  .nav-item.locked{opacity:.4;cursor:not-allowed;}
  .nav-item .badge{margin-left:auto;font-size:10px;background:var(--gray-light);color:var(--gray);padding:2px 7px;border-radius:var(--pill);font-weight:600;}

  .sidebar-footer{margin-top:auto;border-top:1px solid var(--border);padding-top:14px;}
  .profile{display:flex;align-items:center;gap:10px;padding:6px 8px;}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;font-family:'Poppins',sans-serif;flex-shrink:0;}
  .profile-info{flex:1;min-width:0;}
  .profile-info .pname{font-size:13.5px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .profile-info .prole{font-size:11px;color:var(--gray);}
  select.role-select{width:100%;margin-top:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--gray-light);color:var(--navy);font-size:12.5px;font-weight:500;}

  /* MAIN */
  .main{flex:1;padding:28px 36px 60px;min-width:0;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;flex-wrap:wrap;gap:14px;}
  .topbar h1{font-size:26px;margin:0 0 4px;color:var(--navy-2);font-weight:700;}
  .topbar .sub{color:var(--gray);font-size:13.5px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .month-pill{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:var(--pill);padding:8px 8px 8px 16px;box-shadow:var(--shadow);}
  .month-pill select{border:none;background:transparent;font-weight:600;color:var(--navy);font-size:13.5px;outline:none;}
  .sync-pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--green);background:var(--green-bg);padding:7px 13px;border-radius:var(--pill);font-weight:600;}
  .sync-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .cards-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
  .card{background:#fff;border-radius:var(--card-radius);padding:20px 22px;box-shadow:var(--shadow);border:1px solid var(--border);}
  .card .clabel{font-size:12px;color:var(--gray);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
  .card .cvalue{font-family:'Poppins',sans-serif;font-size:26px;font-weight:700;color:var(--navy-2);}
  .card .cfoot{font-size:12.5px;color:var(--gray);margin-top:6px;}
  .card.accent{background:linear-gradient(135deg,var(--navy),#1c3d75);color:#fff;}
  .card.accent .clabel{color:#c8d7f5;}
  .card.accent .cvalue{color:#fff;}
  .card.accent .cfoot{color:#a9c0ec;}
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:var(--pill);}
  .tag.green{background:var(--green-bg);color:var(--green);}
  .tag.red{background:var(--red-bg);color:var(--red);}
  .tag.amber{background:var(--amber-bg);color:var(--amber);}
  .tag.gray{background:var(--gray-light);color:var(--gray);}

  .section-card{background:#fff;border-radius:var(--card-radius);border:1px solid var(--border);box-shadow:var(--shadow);padding:24px;margin-bottom:22px;}
  .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .section-head h3{margin:0;font-size:17px;color:var(--navy-2);}
  .section-head .shint{font-size:12.5px;color:var(--gray);margin-top:2px;}

  .btn{border-radius:var(--pill);padding:10px 20px;font-size:13.5px;font-weight:600;border:none;display:inline-flex;align-items:center;gap:7px;transition:.15s;}
  .btn-primary{background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(47,107,240,0.28);}
  .btn-primary:hover{background:#2559d6;}
  .btn-ghost{background:var(--gray-light);color:var(--navy);}
  .btn-ghost:hover{background:#e2e8f2;}
  .btn-danger{background:var(--red-bg);color:var(--red);}
  .btn-sm{padding:6px 13px;font-size:12px;}

  .proj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
  .proj-card{border:1px solid var(--border);border-radius:16px;padding:18px 20px;background:#fbfdff;}
  .proj-card.negative{border-color:#f4c6c2;background:var(--red-bg);}
  .proj-card .ptitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .proj-card .ptitle b{font-size:15px;color:var(--navy-2);}
  .proj-bar{height:9px;border-radius:var(--pill);background:var(--gray-light);overflow:hidden;margin:10px 0 8px;}
  .proj-bar .fill{height:100%;border-radius:var(--pill);background:var(--blue);transition:.3s;}
  .proj-bar .fill.over{background:var(--red);}
  .proj-nums{display:flex;justify-content:space-between;font-size:12.5px;color:var(--gray);}
  .proj-nums b{color:var(--navy-2);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--gray);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:0 12px 10px;border-bottom:1px solid var(--border);}
  td{padding:12px 12px;border-bottom:1px solid #f0f3f8;color:var(--navy-2);}
  tr:last-child td{border-bottom:none;}
  .muted{color:var(--gray);}
  .empty{text-align:center;padding:40px 20px;color:var(--gray);}
  .empty svg{margin-bottom:10px;opacity:.5;}

  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--navy);margin-bottom:6px;}
  .field input,.field select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:#fbfdff;font-size:13.5px;color:var(--navy-2);outline:none;}
  .field input:focus,.field select:focus{border-color:var(--blue);}
  .field .hint{font-size:11.5px;color:var(--gray);margin-top:4px;}

  .lock-panel{text-align:center;padding:70px 20px;color:var(--gray);}
  .lock-panel svg{margin-bottom:14px;opacity:.5;}
  .lock-panel h3{color:var(--navy-2);margin-bottom:6px;}

  .icon-btn{background:none;border:none;padding:6px;border-radius:8px;color:var(--gray);display:inline-flex;}
  .icon-btn:hover{background:var(--gray-light);color:var(--navy);}

  @media(max-width:1100px){.cards-row{grid-template-columns:repeat(2,1fr);}.form-grid{grid-template-columns:1fr;}}
  @media(max-width:800px){.app{flex-direction:column;}.sidebar{width:100%;height:auto;position:relative;flex-direction:row;overflow-x:auto;}.sidebar-footer{display:none;}.nav-group{display:flex;gap:4px;margin:0;}.nav-label{display:none;}.main{padding:20px;}.cards-row{grid-template-columns:1fr;}}
</style>
</head>

const $$ = (s,el=document)=>Array.from(el.querySelectorAll(s));
const fmt = n => '$' + (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MONTHS_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function monthLabel(m){ const [y,mo]=m.split('-'); return MONTHS_ES[parseInt(mo,10)-1]+' '+y; }
function currentMonthStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthRange(){
  const list=[]; const now=new Date();
  for(let i=-9;i<=2;i++){
    const d=new Date(now.getFullYear(), now.getMonth()+i, 1);
    list.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  return list;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ---------------- Estado ---------------- */
let role = 'equipo';
let currentTab = 'resumen';
let selectedMonth = currentMonthStr();
let projects = [];
let expenses = [];
let official = [];
let config = { savingsTargetPct: 10 };
let editingOfficialId = null;
let editingProjectId = null;

const ROLE_LABELS = {
  equipo:{name:'Equipo de Capacitación', sub:'Puede cargar gastos', initials:'EC'},
  supervisora:{name:'Supervisora', sub:'Vista de seguimiento', initials:'SP'},
  admin:{name:'Mónica Urdaneta', sub:'Administradora del presupuesto', initials:'MU'}
};

/* ---------------- Storage ---------------- */
async function safeGet(key){
  try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function safeSet(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), true); return true; }
  catch(e){ console.error('storage error', e); return false; }
}

async function seedIfEmpty(){
  let p = await safeGet('tb-projects');
  if(!p){
    p = [
      {id:uid(), name:'Onboarding', budget:2000},
      {id:uid(), name:'Liderazgo', budget:1800},
      {id:uid(), name:'Formación técnica', budget:2500},
      {id:uid(), name:'Certificaciones', budget:1200},
    ];
    await safeSet('tb-projects', p);
  }
  let c = await safeGet('tb-config');
  if(!c){ c = {savingsTargetPct:10}; await safeSet('tb-config', c); }
  let e = await safeGet('tb-expenses');
  if(!e){ e = []; await safeSet('tb-expenses', e); }
  let o = await safeGet('tb-official');
  if(!o){ o = []; await safeSet('tb-official', o); }
}

async function loadAll(){
  const [p,e,o,c] = await Promise.all([
    safeGet('tb-projects'), safeGet('tb-expenses'), safeGet('tb-official'), safeGet('tb-config')
  ]);
  projects = p || [];
  expenses = e || [];
  official = o || [];
  config = c || {savingsTargetPct:10};
}

/* ---------------- Cálculos ---------------- */
function teamTotalForMonth(mes, projectId){
  return expenses.filter(x=>x.mes===mes && (!projectId || x.proyectoId===projectId)).reduce((s,x)=>s+Number(x.monto||0),0);
}
function officialTotalForMonth(mes, projectId){
  return official.filter(x=>x.mes===mes && (!projectId || x.proyectoId===projectId)).reduce((s,x)=>s+Number(x.monto||0),0);
}
function totalBudget(){
  return projects.reduce((s,p)=>s+Number(p.budget||0),0);
}
function isMonthClosed(mes){
  return official.some(x=>x.mes===mes);
}

/* ---------------- Render: shell ---------------- */
function renderRoleUI(){
  const r = ROLE_LABELS[role];
  $('#profileName').textContent = r.name;
  $('#profileRoleLabel').textContent = r.sub;
  $('#avatarInitials').textContent = r.initials;
  $('#roleSelect').value = role;

  const lockedForNonAdmin = ['finanzas','config'];
  $$('.nav-item').forEach(btn=>{
    const tab = btn.dataset.tab;
    btn.classList.toggle('active', tab===currentTab);
    const locked = lockedForNonAdmin.includes(tab) && role!=='admin';
    btn.classList.toggle('locked', locked);
  });
}

function renderMonthSelect(){
  const sel = $('#monthSelect');
  sel.innerHTML = '';
  monthRange().reverse().forEach(m=>{
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = monthLabel(m);
    if(m===selectedMonth) opt.selected = true;
    sel.appendChild(opt);
  });
}

const TAB_META = {
  resumen:{title:'Resumen general', sub:'Estado consolidado del presupuesto de capacitación'},
  proyectos:{title:'Gasto por proyecto', sub:'Disponible y consumido por cada proyecto de capacitación'},
  cargar:{title:'Cargar gasto', sub:'Registra cada factura ingresada en Procura'},
  gastos:{title:'Gastos cargados por el equipo', sub:'Detalle de todo lo registrado en el mes'},
  finanzas:{title:'Panel oficial de Finanzas', sub:'Cifra oficial de gasto, cargada a mes vencido'},
  config:{title:'Proyectos y presupuesto', sub:'Configura los proyectos, montos y objetivo de ahorro'},
};

/* ---------------- Render: tabs ---------------- */
function renderContent(){
  const meta = TAB_META[currentTab];
  $('#pageTitle').textContent = meta.title;
  $('#pageSub').textContent = meta.sub;
  const el = $('#content');

  if((currentTab==='finanzas' || currentTab==='config') && role!=='admin'){
    el.innerHTML = `
      <div class="section-card">
        <div class="lock-panel">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#7c8aa0" stroke-width="1.8"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <h3>Acceso solo para administración</h3>
          <div>Esta sección es editable únicamente por quien gestiona el presupuesto.<br>Cambia el rol a "Administrador" en la barra lateral para verla.</div>
        </div>
      </div>`;
    return;
  }

  if(currentTab==='resumen') return renderResumen(el);
  if(currentTab==='proyectos') return renderProyectos(el);
  if(currentTab==='cargar') return renderCargar(el);
  if(currentTab==='gastos') return renderGastos(el);
  if(currentTab==='finanzas') return renderFinanzas(el);
  if(currentTab==='config') return renderConfig(el);
}

function renderResumen(el){
  const budget = totalBudget();
  const team = teamTotalForMonth(selectedMonth);
  const off = officialTotalForMonth(selectedMonth);
  const closed = isMonthClosed(selectedMonth);
  const gastoConsiderado = closed ? off : team;
  const disponible = budget - gastoConsiderado;
  const objetivoAhorro = budget * (Number(config.savingsTargetPct||0)/100);
  const disponibleVsObjetivo = disponible - objetivoAhorro;
  const pendienteConciliar = closed ? (team - off) : null;

  el.innerHTML = `
    <div class="cards-row">
      <div class="card accent">
        <div class="clabel">Presupuesto del mes</div>
        <div class="cvalue">${fmt(budget)}</div>
        <div class="cfoot">${projects.length} proyectos activos · ${monthLabel(selectedMonth)}</div>
      </div>
      <div class="card">
        <div class="clabel">${closed ? 'Gasto oficial (Finanzas)' : 'Gasto preliminar (equipo)'}</div>
        <div class="cvalue" style="color:${gastoConsiderado>budget?'var(--red)':'var(--navy-2)'}">${fmt(gastoConsiderado)}</div>
        <div class="cfoot">${closed ? 'Confirmado en el panel de Finanzas' : 'Aún no ha cerrado el panel de Finanzas'}</div>
      </div>
      <div class="card">
        <div class="clabel">Disponible</div>
        <div class="cvalue" style="color:${disponible<0?'var(--red)':'var(--green)'}">${fmt(disponible)}</div>
        <div class="cfoot">${((gastoConsiderado/budget)*100 || 0).toFixed(0)}% del presupuesto consumido</div>
      </div>
      <div class="card">
        <div class="clabel">Disponible vs objetivo de ahorro</div>
        <div class="cvalue" style="color:${disponibleVsObjetivo<0?'var(--red)':'var(--green)'}">${fmt(disponibleVsObjetivo)}</div>
        <div class="cfoot">Objetivo de ahorro: ${fmt(objetivoAhorro)} (${config.savingsTargetPct||0}%)</div>
      </div>
    </div>

    <div class="section-card">
      <div class="section-head">
        <div>
          <h3>Conciliación con Finanzas</h3>
          <div class="shint">Comparación entre lo cargado por el equipo y lo oficial del panel de Finanzas</div>
        </div>
        ${closed ? `<span class="tag ${Math.abs(pendienteConciliar)<0.01?'green':'amber'}">${Math.abs(pendienteConciliar)<0.01?'Conciliado':'Diferencia detectada'}</span>` : `<span class="tag gray">Mes sin cerrar</span>`}
      </div>
      <table>
        <tr><th>Fuente</th><th>Monto</th><th>Estado</th></tr>
        <tr><td>Cargado por el equipo (Procura)</td><td><b>${fmt(team)}</b></td><td class="muted">${expenses.filter(x=>x.mes===selectedMonth).length} facturas registradas</td></tr>
        <tr><td>Oficial — Panel de Finanzas</td><td><b>${fmt(off)}</b></td><td class="muted">${closed?'Cargado por administración':'Pendiente de carga a mes vencido'}</td></tr>
        ${closed?`<tr><td>Diferencia por conciliar</td><td><b style="color:${Math.abs(pendienteConciliar)<0.01?'var(--green)':'var(--red)'}">${fmt(pendienteConciliar)}</b></td><td class="muted">${pendienteConciliar>0?'El equipo cargó más de lo reflejado por Finanzas':pendienteConciliar<0?'Finanzas refleja más de lo cargado por el equipo':'Todo coincide'}</td></tr>`:''}
      </table>
    </div>

    <div class="section-card">
      <div class="section-head">
        <div><h3>Vista rápida por proyecto</h3><div class="shint">Ver detalle completo en "Gasto por proyecto"</div></div>
      </div>
      ${renderProjectMiniList()}
    </div>
  `;
}

function renderProjectMiniList(){
  if(projects.length===0) return `<div class="empty">Aún no hay proyectos configurados.</div>`;
  const closed = isMonthClosed(selectedMonth);
  return `<div class="proj-grid">${projects.map(p=>{
    const spent = closed ? officialTotalForMonth(selectedMonth,p.id) : teamTotalForMonth(selectedMonth,p.id);
    const avail = Number(p.budget||0)-spent;
    const pct = p.budget>0 ? Math.min(100,(spent/p.budget)*100) : 0;
    return `<div class="proj-card ${avail<0?'negative':''}">
      <div class="ptitle"><b>${p.name}</b>${avail<0?'<span class="tag red">Negativo</span>':''}</div>
      <div class="proj-bar"><div class="fill ${avail<0?'over':''}" style="width:${pct}%"></div></div>
      <div class="proj-nums"><span>Gastado <b>${fmt(spent)}</b></span><span>Disp. <b>${fmt(avail)}</b></span></div>
    </div>`;
  }).join('')}</div>`;
}

function renderProyectos(el){
  const closed = isMonthClosed(selectedMonth);
  el.innerHTML = `
    <div class="section-card">
      <div class="section-head">
        <div><h3>Detalle por proyecto — ${monthLabel(selectedMonth)}</h3>
        <div class="shint">${closed?'Se muestra el gasto oficial confirmado por Finanzas':'Se muestra el gasto preliminar cargado por el equipo (mes aún sin cerrar)'}</div></div>
      </div>
      ${projects.length===0? `<div class="empty">No hay proyectos configurados todavía.</div>` : `
      <table>
        <tr><th>Proyecto</th><th>Presupuesto</th><th>Gastado</th><th>Disponible</th><th>% Uso</th><th>Estado</th></tr>
        ${projects.map(p=>{
          const spent = closed ? officialTotalForMonth(selectedMonth,p.id) : teamTotalForMonth(selectedMonth,p.id);
          const avail = Number(p.budget||0)-spent;
          const pct = p.budget>0? (spent/p.budget*100):0;
          return `<tr>
            <td><b>${p.name}</b></td>
            <td>${fmt(p.budget)}</td>
            <td>${fmt(spent)}</td>
            <td style="color:${avail<0?'var(--red)':'var(--navy-2)'};font-weight:600">${fmt(avail)}</td>
            <td>${pct.toFixed(0)}%</td>
            <td>${avail<0?'<span class="tag red">Excedido</span>':pct>85?'<span class="tag amber">Casi al límite</span>':'<span class="tag green">Saludable</span>'}</td>
          </tr>`;
        }).join('')}
      </table>`}
    </div>
  `;
}

function renderCargar(el){
  const recientes = expenses.filter(x=>x.mes===selectedMonth).sort((a,b)=>b.fechaCarga.localeCompare(a.fechaCarga)).slice(0,8);
  el.innerHTML = `
    <div class="section-card">
      <div class="section-head"><div><h3>Nueva factura</h3><div class="shint">Registra cada factura tal como ingresa a Procura</div></div></div>
      <form id="expenseForm">
        <div class="form-grid">
          <div class="field"><label>N.º de solicitud interna</label><input required id="f-solicitud" placeholder="Ej. SOL-2026-0145"></div>
          <div class="field"><label>Proveedor</label><input required id="f-proveedor" placeholder="Nombre del proveedor"></div>
          <div class="field"><label>Concepto</label><input required id="f-concepto" placeholder="Descripción del gasto"></div>
          <div class="field"><label>Monto (USD)</label><input required id="f-monto" type="number" step="0.01" min="0" placeholder="0.00"></div>
          <div class="field"><label>Proyecto</label>
            <select required id="f-proyecto">
              <option value="" disabled selected>Selecciona un proyecto</option>
              ${projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Fecha de carga</label><input id="f-fecha" type="date" value="${todayISO()}"><div class="hint">Se completa automáticamente, puedes ajustarla si corresponde a otro día</div></div>
        </div>
        <button class="btn btn-primary" type="submit">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Registrar gasto
        </button>
      </form>
    </div>

    <div class="section-card">
      <div class="section-head"><div><h3>Últimas cargas de ${monthLabel(selectedMonth)}</h3></div></div>
      ${recientes.length===0? `<div class="empty">Todavía no se ha cargado ningún gasto este mes.</div>` : `
      <table>
        <tr><th>Fecha</th><th>Solicitud</th><th>Proveedor</th><th>Concepto</th><th>Proyecto</th><th>Monto</th></tr>
        ${recientes.map(x=>`<tr>
          <td class="muted">${x.fechaCarga}</td><td>${x.solicitud}</td><td>${x.proveedor}</td><td>${x.concepto}</td>
          <td>${projectName(x.proyectoId)}</td><td><b>${fmt(x.monto)}</b></td>
        </tr>`).join('')}
      </table>`}
    </div>
  `;

  $('#expenseForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const fecha = $('#f-fecha').value || todayISO();
    const entry = {
      id: uid(),
      solicitud: $('#f-solicitud').value.trim(),
      proveedor: $('#f-proveedor').value.trim(),
      concepto: $('#f-concepto').value.trim(),
      monto: parseFloat($('#f-monto').value)||0,
      proyectoId: $('#f-proyecto').value,
      fechaCarga: fecha,
      mes: fecha.slice(0,7),
      cargadoPor: ROLE_LABELS[role].name,
    };
    expenses.push(entry);
    await safeSet('tb-expenses', expenses);
    await loadAll();
    if(entry.mes!==selectedMonth){ selectedMonth = entry.mes; renderMonthSelect(); }
    renderContent();
  });
}

function projectName(id){ const p = projects.find(p=>p.id===id); return p?p.name:'—'; }

function renderGastos(el){
  const list = expenses.filter(x=>x.mes===selectedMonth).sort((a,b)=>b.fechaCarga.localeCompare(a.fechaCarga));
  const canManage = role==='admin';
  el.innerHTML = `
    <div class="section-card">
      <div class="section-head">
        <div><h3>Gastos cargados — ${monthLabel(selectedMonth)}</h3><div class="shint">Total: ${fmt(teamTotalForMonth(selectedMonth))} · ${list.length} registros</div></div>
      </div>
      ${list.length===0? `<div class="empty">No hay gastos cargados este mes.</div>` : `
      <table>
        <tr><th>Fecha</th><th>Solicitud</th><th>Proveedor</th><th>Concepto</th><th>Proyecto</th><th>Cargado por</th><th>Monto</th>${canManage?'<th></th>':''}</tr>
        ${list.map(x=>`<tr>
          <td class="muted">${x.fechaCarga}</td><td>${x.solicitud}</td><td>${x.proveedor}</td><td>${x.concepto}</td>
          <td>${projectName(x.proyectoId)}</td><td class="muted">${x.cargadoPor||'—'}</td><td><b>${fmt(x.monto)}</b></td>
          ${canManage?`<td><button class="icon-btn" data-del-expense="${x.id}" title="Eliminar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button></td>`:''}
        </tr>`).join('')}
      </table>`}
    </div>
  `;
  $$('[data-del-expense]', el).forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      expenses = expenses.filter(x=>x.id!==btn.dataset.delExpense);
      await safeSet('tb-expenses', expenses);
      await loadAll(); renderContent();
    });
  });
}

function renderFinanzas(el){
  const list = official.filter(x=>x.mes===selectedMonth);
  el.innerHTML = `
    <div class="section-card">
      <div class="section-head"><div><h3>Cargar / editar cifra oficial</h3><div class="shint">Se ingresa a mes vencido con el panel enviado por Finanzas</div></div></div>
      <form id="officialForm">
        <div class="form-grid">
          <div class="field"><label>Proyecto</label>
            <select required id="o-proyecto">
              <option value="" disabled ${!editingOfficialId?'selected':''}>Selecciona un proyecto</option>
              ${projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Monto oficial (USD)</label><input required id="o-monto" type="number" step="0.01" min="0" placeholder="0.00"></div>
          <div class="field"><label>Notas (opcional)</label><input id="o-notas" placeholder="Referencia del panel de Finanzas"></div>
        </div>
        <button class="btn btn-primary" type="submit">${editingOfficialId?'Guardar cambios':'Agregar cifra oficial'}</button>
        ${editingOfficialId?'<button type="button" class="btn btn-ghost" id="cancelEditOfficial" style="margin-left:8px">Cancelar</button>':''}
      </form>
    </div>

    <div class="section-card">
      <div class="section-head"><div><h3>Cifras oficiales — ${monthLabel(selectedMonth)}</h3><div class="shint">Total oficial: ${fmt(officialTotalForMonth(selectedMonth))}</div></div></div>
      ${list.length===0? `<div class="empty">Finanzas aún no ha cerrado este mes. El resumen usará el dato preliminar del equipo mientras tanto.</div>` : `
      <table>
        <tr><th>Proyecto</th><th>Monto oficial</th><th>Notas</th><th></th></tr>
        ${list.map(x=>`<tr>
          <td><b>${projectName(x.proyectoId)}</b></td><td>${fmt(x.monto)}</td><td class="muted">${x.notas||'—'}</td>
          <td style="display:flex;gap:4px;">
            <button class="icon-btn" data-edit-off="${x.id}" title="Editar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
            <button class="icon-btn" data-del-off="${x.id}" title="Eliminar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
          </td>
        </tr>`).join('')}
      </table>`}
    </div>
  `;

  if(editingOfficialId){
    const item = official.find(x=>x.id===editingOfficialId);
    if(item){ $('#o-proyecto').value=item.proyectoId; $('#o-monto').value=item.monto; $('#o-notas').value=item.notas||''; }
    $('#cancelEditOfficial').addEventListener('click',()=>{editingOfficialId=null;renderContent();});
  }

  $('#officialForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const proyectoId = $('#o-proyecto').value;
    const monto = parseFloat($('#o-monto').value)||0;
    const notas = $('#o-notas').value.trim();
    if(editingOfficialId){
      official = official.map(x=>x.id===editingOfficialId?{...x,proyectoId,monto,notas}:x);
      editingOfficialId=null;
    } else {
      official.push({id:uid(), mes:selectedMonth, proyectoId, monto, notas});
    }
    await safeSet('tb-official', official);
    await loadAll(); renderContent();
  });

  $$('[data-edit-off]', el).forEach(btn=>btn.addEventListener('click',()=>{editingOfficialId=btn.dataset.editOff;renderContent();}));
  $$('[data-del-off]', el).forEach(btn=>btn.addEventListener('click', async ()=>{
    official = official.filter(x=>x.id!==btn.dataset.delOff);
    await safeSet('tb-official', official);
    await loadAll(); renderContent();
  }));
}

    </div>

    <div class="section-card">
      <div class="section-head"><div><h3>Proyectos configurados</h3><div class="shint">Presupuesto total: ${fmt(totalBudget())}</div></div></div>
      ${projects.length===0? `<div class="empty">Aún no hay proyectos.</div>` : `
      <table>
        <tr><th>Proyecto</th><th>Presupuesto mensual</th><th></th></tr>
        ${projects.map(p=>`<tr>
          <td><b>${p.name}</b></td><td>${fmt(p.budget)}</td>
          <td style="display:flex;gap:4px;">
            <button class="icon-btn" data-edit-proj="${p.id}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
            <button class="icon-btn" data-del-proj="${p.id}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
          </td>
        </tr>`).join('')}
      </table>`}
    </div>
  `;

  $('#savingsForm').addEventListener('submit', async e=>{
    e.preventDefault();
    config = {...config, savingsTargetPct: parseFloat($('#sv-pct').value)||0};
    await safeSet('tb-config', config);
    await loadAll(); renderContent();
  });

  if(editingProjectId){
    const item = projects.find(p=>p.id===editingProjectId);
    if(item){ $('#p-nombre').value=item.name; $('#p-budget').value=item.budget; }
    $('#cancelEditProject').addEventListener('click',()=>{editingProjectId=null;renderContent();});
  }

  $('#projectForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const name = $('#p-nombre').value.trim();
    const budget = parseFloat($('#p-budget').value)||0;
    if(editingProjectId){
      projects = projects.map(p=>p.id===editingProjectId?{...p,name,budget}:p);
      editingProjectId=null;
    } else {
      projects.push({id:uid(), name, budget});
    }
    await safeSet('tb-projects', projects);
    await loadAll(); renderContent();
  });

  $$('[data-edit-proj]', el).forEach(btn=>btn.addEventListener('click',()=>{editingProjectId=btn.dataset.editProj;renderContent();}));
  $$('[data-del-proj]', el).forEach(btn=>btn.addEventListener('click', async ()=>{
    projects = projects.filter(p=>p.id!==btn.dataset.delProj);
    await safeSet('tb-projects', projects);
    await loadAll(); renderContent();
  }));
}

/* ---------------- Eventos globales ---------------- */
$$('.nav-item').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const tab = btn.dataset.tab;
    if((tab==='finanzas'||tab==='config') && role!=='admin'){ currentTab = tab; renderRoleUI(); renderContent(); return; }
    currentTab = tab; editingOfficialId=null; editingProjectId=null;
    renderRoleUI(); renderContent();
  });
});
$('#roleSelect').addEventListener('change', e=>{
  role = e.target.value;
  renderRoleUI(); renderContent();
});
$('#monthSelect').addEventListener('change', e=>{
  selectedMonth = e.target.value;
  renderContent();
});

/* ---------------- Init & polling en vivo ---------------- */
async function init(){
  await seedIfEmpty();
  await loadAll();
  renderMonthSelect();
  renderRoleUI();
  renderContent();
  setInterval(async ()=>{
    await loadAll();
    renderContent();
  }, 6000);
  document.addEventListener('visibilitychange', async ()=>{
    if(document.visibilityState==='visible'){ await loadAll(); renderContent(); }
  });
}
init();
</script>
</body>
</html>
